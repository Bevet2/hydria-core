name: Hydria Core CI

on:
  push:
  pull_request:

jobs:
  check-test:
    name: Check and Test
    runs-on: ubuntu-latest
    env:
      CI: "true"
      OPENROUTER_API_KEY: ci-placeholder
      WEB_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:8080
      LOCAL_MODEL_PROVIDER: ollama
      LOCAL_MODEL_NAME: qwen2.5:3b
      LOCAL_MODEL_BASE_URL: http://127.0.0.1:11435
      LOCAL_MODEL_OBSERVER_ENABLED: "false"
      LOCAL_STUDENT_FALLBACK_MODEL: openai/gpt-5.4-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: bash scripts/check.sh

      - name: Test
        run: bash scripts/test.sh

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: check-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build and smoke test image
        run: bash scripts/docker-smoke.sh

  postgres-persistence:
    name: PostgreSQL Persistence Smoke
    runs-on: ubuntu-latest
    needs: check-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydria
          POSTGRES_USER: hydria
          POSTGRES_PASSWORD: hydria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydria -d hydria"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      OPENROUTER_API_KEY: ci-placeholder
      WEB_ORIGIN: http://localhost:18081
      VITE_API_BASE_URL: http://localhost:18081
      POSTGRES_URL: postgres://hydria:hydria@127.0.0.1:5432/hydria
      HYDRIA_POSTGRES_SMOKE_SCHEMA: hydria_ci_smoke
      LOCAL_MODEL_PROVIDER: ollama
      LOCAL_MODEL_NAME: ci-missing-model
      LOCAL_MODEL_BASE_URL: http://127.0.0.1:65535
      LOCAL_MODEL_OBSERVER_ENABLED: "false"
      LOCAL_STUDENT_FALLBACK_MODEL: openai/gpt-5.4-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PostgreSQL adapter, migration, and runtime smoke
        run: npm run persistence:postgres:smoke
