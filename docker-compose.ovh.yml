services:
  hydria-core:
    environment:
      PERSISTENCE_ADAPTER: postgres
      POSTGRES_URL: postgres://hydria:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/hydria
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-hydria_prod}
      WEB_ORIGIN: https://app.hydria.click
      VITE_API_BASE_URL: https://app.hydria.click
      OPENROUTER_HTTP_REFERER: https://app.hydria.click
      LOCAL_MODEL_TIMEOUT_MS: ${LOCAL_MODEL_TIMEOUT_MS:-1000}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hydria
      POSTGRES_USER: hydria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - hydria-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydria -d hydria"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  hydria-postgres:
